# Ticketing config: GitHub Issues. This project-owned copy may be customized.
description = "GitHub Issues through the gh CLI: labels, sub-issues, blocked-by, milestones."

[tickets]
store = "github"
key = ""
repo = "WesleyDenia/SystemBuilder"
access = """
Use the gh CLI against `repo`, passing `-R <repo>` on every call. If a call fails on auth or a missing label, report the blocker and ask the user to authenticate when needed.
"""
fields = """
risk is a label risk:<value>; severity is a label P0-P3. `setup` creates them with the other labels; publish and update set them like any label. estimate is a label est:<value> (`setup` creates none; add on first use). Empty field: no label.
"""
reference = """
A reference is a line in the ticket's References section: `type — location, section`, location a path from {project-root} or a url for a remote source, opened before it is cited. GitHub renders urls as links; nothing more to do.
"""

[verbs]
setup = """
Connect: `gh auth login`.
Labels must exist before they are used. List the repo's labels (`gh label list --limit 1000 --json name`) and run `gh label create <name>` for each of these it lacks, comparing names ignoring case: the [tickets.types] values except initiative (a milestone), the [tickets.status] values except done and dropped (closed states), `hitl`, risk:low, risk:medium, risk:high, and P0-P3. A create that fails with \"already exists\" found the label after all: leave it. Never `--force`: it recolours a label the repo already has. Offer this at first publish, or whenever a label is missing.
"""
write = """
One issue per new ticket, created in tree and prerequisite order so every relation has a number to point at. Create with content only: `gh issue create --title <t> --body-file <b> --label <type>,<[tickets.status].<state>>[,hitl,risk:<r>,P<n>] [--milestone <initiative>]`, and write tracker_id and remote from the url it prints before anything else. Then add relations with `gh issue edit <n> --parent <n> --add-blocked-by <n,n>`, leaving out any already shown by `gh issue view <n> --json parent,blockedBy`. No parent: omit `--parent`; no initiative: omit `--milestone`. Needs gh 2.94+; check `--help` when a flag is doubted. Status is [tickets.status].<state>, the ticket's state (`state` in `tickets.py` rows), as a label swap on an open issue. done: remove the status label and `gh issue close <n>`; dropped: the same with `--reason \"not planned\"`. An initiative is a milestone holding its tree's issues. The body sent is the whole local file, without frontmatter lines tracker_id, remote, tracker_status, status, assignee. After a write, mirror tracker_id, remote, tracker_status, assignee, and after in the local file — never status, which is the build's; commit local files on the current branch when output_folder is in a git repo, never push.
"""
query = """
One issue: `gh issue view <n> --json number,title,labels,assignees,state,stateReason,milestone,parent,blockedBy,subIssuesSummary,body`. Type, hitl, risk, severity, and status are labels — except done and dropped, the closed states per [tickets.status]; the body's covers holds the source requirement ids. Children: `gh issue view <n> --json subIssues`. Words: `gh issue list --search \"<words>\" --state all`, narrowed by --label. The local file: `tickets.py find <folder> <n>`. A child the tracker holds with no file in the tree gets an [[entry]] with the next unused id in its parent's tickets.toml, then its file. Mirror the issue's status label or closed state into the local file as tracker_status, the BMad word per [tickets.status], beside tracker_id and remote — never into status, which is the build's.
"""

[tickets.types]
initiative = "milestone"
epic = "epic"
story = "story"
spike = "spike"
bug = "bug"

[tickets.status]
backlog = "backlog"
in-progress = "in-progress"
review = "review"
done = "closed"
dropped = "closed: not planned"
